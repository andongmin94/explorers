<!doctype html>
<html lang="ko" data-explorer="disk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f2f4" />
    <meta
      name="description"
      content="같은 디스크 요청을 FCFS·SSTF, SCAN·LOOK, C-SCAN·SCAN 세 레슨으로 처리하며 헤드 이동과 대기를 비교하는 학습 도구"
    />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ffcc00'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23000' fill-opacity='.8'/%3E%3C/svg%3E" />
    <title>디스크 스케줄링 탐색기</title>
    <script>
      // Theme before first paint: the saved choice, else the system setting.
      (() => {
        let theme = "light";
        try {
          theme =
            localStorage.getItem("disk-explorer:theme") ||
            (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>디스크 스케줄링을 실행하려면 JavaScript를 켜 주세요.</noscript>
    <script type="module" src="/src/explorers/disk/main.tsx"></script>
  </body>
</html>
