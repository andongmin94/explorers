# Verify every push and pull request. Deployment itself is done by
# Cloudflare Workers Builds (connected to this repository), which builds main
# with `npm run build` and serves dist/ as configured in wrangler.jsonc.
name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser smoke tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
        env:
          CI: "1"
