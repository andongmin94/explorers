<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>페이지를 찾을 수 없습니다 · 탐색기</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='8' fill='%23007aff'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Pretendard, system-ui, "Segoe UI", "Malgun Gothic", sans-serif;
        background: #fff;
        color: rgb(0 0 0 / 0.85);
      }
      @media (prefers-color-scheme: dark) {
        :root { background: #1e1e1e; color: rgb(255 255 255 / 0.85); }
        a { background: rgb(255 255 255 / 0.1) !important; }
      }
      body { display: grid; min-height: 100dvh; margin: 0; place-items: center; }
      main { display: grid; gap: 12px; max-width: 420px; padding: 24px; text-align: center; word-break: keep-all; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 0; font-size: 14px; line-height: 1.6; opacity: 0.7; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
      a { padding: 7px 14px; border-radius: 999px; background: rgb(0 0 0 / 0.05); color: inherit; font-size: 13px; font-weight: 510; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>페이지를 찾을 수 없습니다</h1>
      <p>주소가 바뀌었거나 없는 페이지입니다. 아래에서 탐색기를 골라 주세요.</p>
      <nav aria-label="탐색기">
        <a href="/protocol/">프로토콜</a>
        <a href="/cpu/">CPU 스케줄링</a>
        <a href="/memory/">메모리</a>
        <a href="/transaction/">트랜잭션</a>
        <a href="/disk/">디스크 스케줄링</a>
        <a href="/git/">Git</a>
      </nav>
    </main>
  </body>
</html>
