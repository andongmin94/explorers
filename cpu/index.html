<!doctype html>
<html lang="ko" data-explorer="cpu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f7" />
    <meta
      name="description"
      content="세 작업이 하나의 CPU를 나누는 과정. 라운드 로빈·FCFS·SJF·SRTF를 레슨별로 실행하고, 예측하고, 비교하는 인터랙티브 수업."
    />
    <title>CPU 스케줄링 탐색기</title>
    <link rel="icon" type="image/svg+xml" href="/cpu/favicon.svg" />
    <script>
      // Theme before first paint: the saved choice, else the system setting.
      (() => {
        let theme = "light";
        try {
          theme =
            localStorage.getItem("cpu-explorer:theme") ||
            (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>CPU 스케줄링을 실행하려면 JavaScript를 켜 주세요.</noscript>
    <script type="module" src="/src/explorers/cpu/main.tsx"></script>
  </body>
</html>
