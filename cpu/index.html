<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f7" />
    <meta
      name="description"
      content="세 프로세스가 하나의 CPU를 나누는 과정. 라운드 로빈과 FCFS를 실행하고, 예측하고, 비교하는 인터랙티브 수업."
    />
    <title>CPU 스케줄링 탐험가</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/PretendardVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("cpu-explorer:theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>CPU 스케줄링을 실행하려면 JavaScript를 켜 주세요.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
